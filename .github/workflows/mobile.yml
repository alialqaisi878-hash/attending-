# يبني تطبيق أندرويد (APK للتجربة) ويتأكد إن تطبيق الآيفون يتبنى، مع كل تحديث للكود
name: mobile apps
on:
  push:
    paths: ['public/**', 'mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: basma-android-debug, path: mobile/android/app/build/outputs/apk/debug/*.apk }
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
